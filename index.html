<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Generador de Receta · Visiolística</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Arial, sans-serif;
      background: #f4f1ee;
      min-height: 100vh;
      color: #1a1a1a;
    }

    /* ── PIN ── */
    #pin-screen {
      position: fixed;
      inset: 0;
      background: #f4f1ee;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      padding: 24px;
    }
    #pin-screen .logo { margin-bottom: 28px; }
    #pin-card {
      background: #fff;
      border-radius: 16px;
      padding: 32px 28px;
      box-shadow: 0 4px 24px rgba(0,0,0,.10);
      width: 100%;
      max-width: 300px;
      text-align: center;
    }
    #pin-card h2 { font-size: 13px; color: #555; margin-bottom: 20px; font-weight: 500; }
    #pin-dots { display: flex; justify-content: center; gap: 14px; margin-bottom: 28px; }
    .dot {
      width: 14px; height: 14px; border-radius: 50%;
      background: #ddd; transition: background .15s;
    }
    .dot.filled { background: #3d1f0a; }
    .dot.error  { background: #c0392b; }
    #pin-error { font-size: 11px; color: #c0392b; margin-bottom: 12px; min-height: 16px; }
    #pin-keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .key {
      padding: 14px 0; border-radius: 10px;
      border: 1px solid #ddd; background: #fff;
      font-size: 18px; font-weight: 500; cursor: pointer;
      transition: background .1s;
    }
    .key:hover { background: #f4f1ee; }
    .key.del { font-size: 14px; }
    .key.empty { visibility: hidden; cursor: default; }
    #pin-card p { margin-top: 20px; font-size: 11px; color: #aaa; }
    @keyframes shake {
      0%,100%{transform:translateX(0)}
      20%{transform:translateX(-6px)} 40%{transform:translateX(6px)}
      60%{transform:translateX(-4px)} 80%{transform:translateX(4px)}
    }
    .shake { animation: shake .5s; }

    /* ── APP ── */
    #app { display: none; max-width: 780px; margin: 0 auto; padding: 24px 16px; }
    #app.visible { display: block; }

    header {
      display: flex; align-items: center; justify-content: space-between;
      padding-bottom: 16px; margin-bottom: 22px;
      border-bottom: 2px solid #ddd;
      flex-wrap: wrap; gap: 10px;
    }
    .header-actions { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }

    /* Botones generales */
    .btn {
      padding: 7px 12px; border-radius: 8px;
      border: 1px solid #ccc; background: #f4f1ee;
      color: #1a1a1a; font-size: 13px; cursor: pointer;
      transition: background .1s, border-color .1s;
    }
    .btn:hover { background: #ebe7e3; }
    .btn.active { border-color: #3d1f0a; font-weight: 600; }
    .btn.primary { background: #c0185a; color: #fff; border-color: #c0185a; font-weight: 600; padding: 9px 20px; }
    .btn.primary:hover { background: #a01448; }
    .btn.dark { background: #3d1f0a; color: #fff; border-color: #3d1f0a; font-weight: 600; }
    .btn.dark:hover { background: #2a1506; }
    .btn.logout { font-size: 11px; color: #999; padding: 5px 10px; }

    /* Secciones */
    .section {
      border: 1px solid #ddd; border-radius: 10px;
      padding: 14px; margin-bottom: 16px; background: #fff;
    }
    .section-title {
      font-size: 11px; font-weight: 500; color: #c0185a;
      text-transform: uppercase; letter-spacing: .06em; margin-bottom: 12px;
    }

    /* Nombre / fecha */
    .row-2 { display: flex; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
    .row-2 .field { flex: 2; min-width: 180px; }
    .row-2 .field.short { flex: 1; min-width: 120px; }
    label { font-size: 11px; color: #888; text-transform: uppercase; letter-spacing: .04em; display: block; margin-bottom: 4px; }
    input[type="text"], textarea {
      width: 100%; padding: 7px 10px; border: 1px solid #ccc; border-radius: 8px;
      font-size: 13px; background: #faf9f8; color: #1a1a1a; outline: none;
    }
    input[type="text"]:focus, textarea:focus { border-color: #3d1f0a; }

    /* Eye rows */
    .eye-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
    .eye-label { width: 30px; font-size: 12px; font-weight: 500; color: #555; flex-shrink: 0; }
    .field-group { display: flex; flex-direction: column; gap: 3px; }
    .field-group label { font-size: 10px; }
    .field-group input {
      width: 72px; text-align: center; padding: 5px 6px;
      border: 1px solid #ccc; border-radius: 6px; font-size: 13px;
      background: #faf9f8; color: #1a1a1a; outline: none;
    }
    .field-group input.small { width: 52px; }
    .field-group input:focus { border-color: #3d1f0a; }

    /* Adición */
    .add-row { display: flex; gap: 20px; flex-wrap: wrap; }

    /* Especificaciones / Uso */
    .spec-row { display: flex; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
    .spec-row .section { flex: 1; min-width: 200px; margin-bottom: 0; }
    .chips { display: flex; gap: 6px; flex-wrap: wrap; }
    .chip {
      padding: 5px 10px; border-radius: 8px; border: 1px solid #ccc;
      background: #f4f1ee; font-size: 11px; cursor: pointer;
      transition: background .1s, border-color .1s, color .1s;
    }
    .chip:hover { background: #ebe7e3; }
    .chip.active { background: #3d1f0a; color: #fff; border-color: #3d1f0a; }

    /* Raw textarea */
    #raw-section textarea { font-family: monospace; font-size: 12px; resize: vertical; }
    .parse-row { display: flex; gap: 8px; align-items: center; margin-top: 10px; flex-wrap: wrap; }
    #parse-msg { font-size: 12px; color: #27ae60; }

    /* Errores */
    #errors {
      display: none; margin-bottom: 16px; padding: 14px;
      border: 1px solid #c0392b; border-radius: 10px; background: #fff5f5;
    }
    #errors .err-title { font-weight: 500; color: #c0392b; font-size: 13px; margin-bottom: 6px; }
    #errors .err-item { font-size: 12px; color: #c0392b; margin-bottom: 3px; }

    /* Acciones */
    .actions { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; }

    /* Logo SVG inline */
    .logo-text { font-family: Georgia, serif; font-size: 34px; font-weight: 700; fill: #3d1f0a; letter-spacing: -1px; }
    .logo-sub  { font-family: Arial, sans-serif; font-size: 10px; fill: #c0185a; letter-spacing: 2.5px; }

    @media (max-width: 540px) {
      .eye-row { gap: 6px; }
      .field-group input { width: 60px; }
      .field-group input.small { width: 44px; }
    }
  </style>
</head>
<body>

<!-- ══ PIN ══════════════════════════════════════════════════ -->
<div id="pin-screen">
  <div class="logo">
    <svg width="240" height="58" viewBox="0 0 300 72" xmlns="http://www.w3.org/2000/svg">
      <text class="logo-text" x="0" y="48">VISIOLÍSTICA</text>
      <text class="logo-sub"  x="2" y="66">TERAPIA VISUAL COMPORTAMENTAL</text>
    </svg>
  </div>
  <div id="pin-card">
    <h2>Acceso profesional</h2>
    <div id="pin-dots"></div>
    <div id="pin-error"></div>
    <div id="pin-keypad"></div>
    <p>Solo personal autorizado de Visiolística</p>
  </div>
</div>

<!-- ══ APP ══════════════════════════════════════════════════ -->
<div id="app">
  <header>
    <svg width="220" height="54" viewBox="0 0 300 72" xmlns="http://www.w3.org/2000/svg">
      <text class="logo-text" x="0" y="48">VISIOLÍSTICA</text>
      <text class="logo-sub"  x="2" y="66">TERAPIA VISUAL COMPORTAMENTAL</text>
    </svg>
    <div class="header-actions">
      <button class="btn logout" onclick="logout()">🔒 Cerrar sesión</button>
      <button class="btn active" id="btn-manual" onclick="setMode('manual')">Manual</button>
      <button class="btn" id="btn-raw"    onclick="setMode('raw')">Entrada libre</button>
    </div>
  </header>

  <!-- Nombre / Fecha -->
  <div class="row-2">
    <div class="field">
      <label>Nombre</label>
      <input type="text" id="nombre" placeholder="Nombre del paciente" />
    </div>
    <div class="field short">
      <label>Fecha</label>
      <input type="text" id="fecha" />
    </div>
  </div>

  <!-- MANUAL -->
  <div id="manual-section">
    <div class="section">
      <div class="section-title">Lejos</div>
      <div class="eye-row" id="row-od"></div>
      <div class="eye-row" id="row-oi"></div>
    </div>
    <div class="section">
      <div class="section-title">Adición</div>
      <div class="add-row">
        <div class="field-group"><label>O.D.</label><input type="text" id="add-od" placeholder="—" style="width:80px;text-align:center;" /></div>
        <div class="field-group"><label>O.I.</label><input type="text" id="add-oi" placeholder="—" style="width:80px;text-align:center;" /></div>
      </div>
    </div>
  </div>

  <!-- ENTRADA LIBRE -->
  <div id="raw-section" class="section" style="display:none;">
    <div class="section-title">Datos en bruto</div>
    <div style="font-size:12px;color:#888;margin-bottom:8px;">O.D. en la primera línea · O.I. en la segunda</div>
    <textarea id="raw-input" rows="4" placeholder="Ej:&#10;+1.50 -0.75 90° AV 0.9&#10;-0.25 -1.00 10° add 2.00"></textarea>
    <div class="parse-row">
      <button class="btn dark" onclick="doParse()">/generate — Parsear</button>
      <button class="btn" onclick="clearRaw()">Limpiar</button>
      <span id="parse-msg"></span>
    </div>
  </div>

  <!-- Especificaciones + Uso -->
  <div class="spec-row">
    <div class="section">
      <div class="section-title">Especificaciones</div>
      <div class="chips" id="chips-specs"></div>
    </div>
    <div class="section">
      <div class="section-title">Para utilizar</div>
      <div class="chips" id="chips-uso"></div>
    </div>
  </div>

  <!-- Errores -->
  <div id="errors"></div>

  <!-- Acciones -->
  <div class="actions">
    <button class="btn" onclick="newReceta()">Nueva receta</button>
    <button class="btn primary" onclick="generatePDF()">/pdf — Generar e imprimir</button>
  </div>
</div>

<script>
/* ══ CONFIG ══════════════════════════════════════════════════ */
const PIN_CORRECT = "2580";
const SPECS = ["MONOFOCAL","MONOFOCAL AVANZADO","BIFOCAL","PROGRESIVO"];
const USOS  = ["CONSTANTE","LEJOS","CERCA"];
const FIELDS = [
  {id:"esferico",  label:"Esférico",   w:72},
  {id:"cilindrico",label:"Cilíndrico", w:72},
  {id:"eje",       label:"Eje",        w:52},
  {id:"prisma",    label:"Prisma",     w:52},
  {id:"base",      label:"Base",       w:72},
  {id:"av",        label:"AV",         w:52},
];

let pinValue = "";
let selectedSpec = "";
let selectedUso  = "";

/* ══ PIN ══════════════════════════════════════════════════════ */
function renderDots(error) {
  const cont = document.getElementById("pin-dots");
  cont.innerHTML = "";
  for (let i = 0; i < PIN_CORRECT.length; i++) {
    const d = document.createElement("div");
    d.className = "dot" + (i < pinValue.length ? (error ? " error" : " filled") : "");
    cont.appendChild(d);
  }
}

function renderKeypad() {
  const keys = ["1","2","3","4","5","6","7","8","9","","0","DEL"];
  const kp = document.getElementById("pin-keypad");
  keys.forEach(k => {
    const btn = document.createElement("button");
    if (k === "") { btn.className = "key empty"; btn.disabled = true; }
    else {
      btn.className = "key" + (k === "DEL" ? " del" : "");
      btn.textContent = k === "DEL" ? "⌫" : k;
      btn.addEventListener("click", () => handlePin(k));
    }
    kp.appendChild(btn);
  });
}

function handlePin(k) {
  if (k === "DEL") { pinValue = pinValue.slice(0,-1); document.getElementById("pin-error").textContent = ""; renderDots(false); return; }
  pinValue += k;
  renderDots(false);
  if (pinValue.length === PIN_CORRECT.length) {
    if (pinValue === PIN_CORRECT) {
      unlock();
    } else {
      renderDots(true);
      document.getElementById("pin-error").textContent = "PIN incorrecto";
      const dots = document.getElementById("pin-dots");
      dots.classList.add("shake");
      setTimeout(() => { pinValue = ""; renderDots(false); dots.classList.remove("shake"); document.getElementById("pin-error").textContent = ""; }, 600);
    }
  }
}

function unlock() {
  document.getElementById("pin-screen").style.display = "none";
  document.getElementById("app").classList.add("visible");
}

function logout() {
  pinValue = "";
  renderDots(false);
  document.getElementById("pin-error").textContent = "";
  document.getElementById("pin-screen").style.display = "flex";
  document.getElementById("app").classList.remove("visible");
  newReceta();
}

/* ══ EYE ROWS ════════════════════════════════════════════════ */
function buildEyeRow(containerId, prefix, labelText) {
  const row = document.getElementById(containerId);
  const lbl = document.createElement("div");
  lbl.className = "eye-label"; lbl.textContent = labelText;
  row.appendChild(lbl);
  FIELDS.forEach(f => {
    const grp = document.createElement("div");
    grp.className = "field-group";
    grp.innerHTML = `<label>${f.label}</label><input type="text" id="${prefix}-${f.id}" class="${f.w<=52?"small":""}" style="width:${f.w}px;" />`;
    row.appendChild(grp);
  });
}

/* ══ MODO ════════════════════════════════════════════════════ */
function setMode(m) {
  document.getElementById("manual-section").style.display = m==="manual" ? "block" : "none";
  document.getElementById("raw-section").style.display    = m==="raw"    ? "block" : "none";
  document.getElementById("btn-manual").classList.toggle("active", m==="manual");
  document.getElementById("btn-raw").classList.toggle("active", m==="raw");
}

/* ══ CHIPS ═══════════════════════════════════════════════════ */
function buildChips(containerId, items, getSelected, setSelected) {
  const cont = document.getElementById(containerId);
  items.forEach(item => {
    const c = document.createElement("button");
    c.className = "chip";
    c.textContent = item;
    c.addEventListener("click", () => {
      setSelected(getSelected() === item ? "" : item);
      refreshChips(containerId, items, getSelected);
    });
    cont.appendChild(c);
  });
}
function refreshChips(containerId, items, getSelected) {
  const chips = document.querySelectorAll(`#${containerId} .chip`);
  chips.forEach((c,i) => c.classList.toggle("active", items[i] === getSelected()));
}

/* ══ PARSEO ══════════════════════════════════════════════════ */
function parseRaw(text) {
  const lines = text.trim().split("\n").map(l=>l.trim()).filter(Boolean);
  const result = {ld:{},li:{},add_od:"",add_oi:""};
  const empty = () => ({esferico:"",cilindrico:"",eje:"",prisma:"",base:"",av:""});

  const parseEye = (line) => {
    const eye = empty(); let rem = line;
    const avM = rem.match(/\bAV\s*[:=]?\s*([\d.,\/]+)/i); if(avM){eye.av=avM[1];rem=rem.replace(avM[0],"");}
    const ejeM = rem.match(/([\d.]+)\s*[°º]/); if(ejeM){eye.eje=ejeM[1];rem=rem.replace(ejeM[0],"");}
    const bmap={binf:"Inferior",inf:"Inferior",bsup:"Superior",sup:"Superior",bn:"Nasal",bi:"Nasal",nasal:"Nasal",bo:"Temporal",temporal:"Temporal"};
    const bM = rem.match(/\b(b(?:inf|sup|n|i|o)|inf|sup|nasal|temporal)\b/i); if(bM){eye.base=bmap[bM[1].toLowerCase()]||bM[1];rem=rem.replace(bM[0],"");}
    const pM = rem.match(/\bPR(?:ISMA)?\s*[:=]?\s*([\d.,]+)/i); if(pM){eye.prisma=pM[1];rem=rem.replace(pM[0]," ");}
    const cM = rem.match(/(?:CIL|C)\s*[:=]?\s*([+-]?[\d.,]+)/i); if(cM){eye.cilindrico=cM[1];rem=rem.replace(cM[0]," ");}
    const nums=[...rem.matchAll(/([+-]?[\d.,]+)/g)].map(m=>m[1]).filter(n=>n!==eye.eje&&n!==eye.av&&n!==eye.prisma);
    if(nums.length>=2&&!eye.cilindrico){eye.esferico=nums[0];eye.cilindrico=nums[1];}else if(nums.length>=1)eye.esferico=nums[0];
    return eye;
  };

  const dataLines=[];
  lines.forEach(l=>{
    if(!l.match(/\badd\b/i)){dataLines.push(l);return;}
    const nums=[...l.matchAll(/([+-]?[\d.,]+)/g)].map(m=>m[1]);
    if(nums.length===2){result.add_od=nums[0];result.add_oi=nums[1];}
    else if(nums.length===1&&!result.add_od)result.add_od=nums[0];
  });
  result.ld = dataLines[0] ? parseEye(dataLines[0]) : empty();
  result.li = dataLines[1] ? parseEye(dataLines[1]) : empty();
  return result;
}

function doParse() {
  const raw = document.getElementById("raw-input").value;
  const p = parseRaw(raw);
  const fill = (prefix, eye) => FIELDS.forEach(f => { const el=document.getElementById(`${prefix}-${f.id}`); if(el) el.value=eye[f.id]||""; });
  fill("od", p.ld); fill("oi", p.li);
  document.getElementById("add-od").value = p.add_od;
  document.getElementById("add-oi").value = p.add_oi;
  document.getElementById("parse-msg").textContent = "✓ Datos extraídos. Revisa y corrige si es necesario.";
  setMode("manual");
}

function clearRaw() {
  document.getElementById("raw-input").value = "";
  document.getElementById("parse-msg").textContent = "";
}

/* ══ VALIDACIÓN ══════════════════════════════════════════════ */
function getEye(prefix) {
  const e={};
  FIELDS.forEach(f=>{ e[f.id]=(document.getElementById(`${prefix}-${f.id}`)||{}).value||""; });
  return e;
}

function validate(od, oi) {
  const errors=[];
  const check=(eye,label)=>{
    if(eye.cilindrico&&!eye.eje) errors.push(`${label}: Cilíndrico sin EJE.`);
    if(eye.eje&&!eye.cilindrico) errors.push(`${label}: EJE sin Cilíndrico.`);
    if(eye.prisma&&!eye.base)   errors.push(`${label}: Prisma sin BASE.`);
    if(eye.base&&!eye.prisma)   errors.push(`${label}: BASE sin Prisma.`);
    if(eye.eje!==""&&(parseFloat(eye.eje)<0||parseFloat(eye.eje)>180)) errors.push(`${label}: EJE fuera de rango (0°–180°).`);
  };
  check(od,"O.D."); check(oi,"O.I."); return errors;
}

function showErrors(errs) {
  const box=document.getElementById("errors");
  if(!errs.length){box.style.display="none";return;}
  box.style.display="block";
  box.innerHTML=`<div class="err-title">⚠️ Clinical validation warning:</div>`+errs.map(e=>`<div class="err-item">• ${e}</div>`).join("");
}

/* ══ GENERAR PDF ═════════════════════════════════════════════ */
function generatePDF() {
  const od = getEye("od"), oi = getEye("oi");
  const errs = validate(od, oi);
  showErrors(errs);
  if (errs.length) return;

  const nombre  = document.getElementById("nombre").value;
  const fecha   = document.getElementById("fecha").value || new Date().toLocaleDateString("es-ES");
  const add_od  = document.getElementById("add-od").value;
  const add_oi  = document.getElementById("add-oi").value;

  const chk = active => `<span style="display:inline-block;width:13px;height:13px;border:1.5px solid #3d1f0a;border-radius:2px;background:${active?"#3d1f0a":"transparent"};vertical-align:middle;margin-right:6px;"></span>`;
  const td  = v => `<td style="border:1px solid #aaa;padding:6px 10px;min-width:72px;font-size:13px;text-align:center;">${v||""}</td>`;
  const th  = v => `<th style="border:1px solid #aaa;padding:6px 10px;background:#ede8e3;font-size:12px;font-weight:700;color:#3d1f0a;">${v}</th>`;
  const lb  = v => `<td style="border:1px solid #aaa;padding:6px 10px;font-size:13px;font-weight:600;background:#f5f0ea;white-space:nowrap;color:#3d1f0a;">${v}</td>`;

  const html = `<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8">
<title>Receta – ${nombre||"Paciente"}</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:Arial,sans-serif;padding:36px;color:#000;background:#fff;max-width:780px;margin:0 auto;}
  table{border-collapse:collapse;width:100%;}
  @media print{body{padding:24px;}}
</style>
</head><body>
  <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px;">
    <div>
      <div style="font-family:Georgia,serif;font-size:34px;font-weight:700;color:#3d1f0a;letter-spacing:-1px;">VISIOLÍSTICA</div>
      <div style="font-size:10px;color:#c0185a;letter-spacing:2.5px;margin-top:3px;">TERAPIA VISUAL COMPORTAMENTAL</div>
    </div>
    <div style="text-align:right;font-size:12px;color:#555;padding-top:8px;">
      <div><strong>Fecha:</strong> ${fecha}</div>
      <div style="font-size:10px;color:#999;margin-top:2px;">Centro Óptico · Cádiz</div>
    </div>
  </div>
  <div style="height:2px;background:linear-gradient(90deg,#3d1f0a,#c0185a);margin:14px 0;border-radius:2px;"></div>
  <div style="font-size:14px;margin-bottom:18px;"><strong>Nombre:</strong>&nbsp;${nombre||"___________________________________"}</div>
  <table style="margin-bottom:20px;">
    <thead><tr>
      <th colspan="2" style="border:1px solid #aaa;padding:6px 10px;background:#ede8e3;"></th>
      ${["ESFÉRICO","CILÍNDRICO","EJE","PRISMA","BASE","AV"].map(th).join("")}
    </tr></thead>
    <tbody>
      <tr>${lb("LEJOS")}${lb("O.D.")}${td(od.esferico)}${td(od.cilindrico)}${td(od.eje?od.eje+"°":"")}${td(od.prisma)}${td(od.base)}${td(od.av)}</tr>
      <tr><td style="border:1px solid #aaa;background:#f5f0ea;"></td>${lb("O.I.")}${td(oi.esferico)}${td(oi.cilindrico)}${td(oi.eje?oi.eje+"°":"")}${td(oi.prisma)}${td(oi.base)}${td(oi.av)}</tr>
      <tr>${lb("ADICIÓN")}${lb("O.D.")}${td(add_od)}${td("")}${td("")}${td("")}${td("")}${td("")}</tr>
      <tr><td style="border:1px solid #aaa;background:#f5f0ea;"></td>${lb("O.I.")}${td(add_oi)}${td("")}${td("")}${td("")}${td("")}${td("")}</tr>
    </tbody>
  </table>
  <div style="margin-bottom:16px;">
    <div style="font-size:12px;font-weight:700;color:#3d1f0a;margin-bottom:8px;text-transform:uppercase;letter-spacing:.06em;">Especificaciones:</div>
    <div style="display:flex;gap:24px;flex-wrap:wrap;font-size:13px;">
      ${SPECS.map(s=>`<div>${chk(selectedSpec===s)}<span style="font-weight:${selectedSpec===s?700:400};">${s}</span></div>`).join("")}
    </div>
  </div>
  <div style="margin-bottom:36px;">
    <div style="font-size:12px;font-weight:700;color:#3d1f0a;margin-bottom:8px;text-transform:uppercase;letter-spacing:.06em;">Para utilizar:</div>
    <div style="display:flex;gap:24px;font-size:13px;">
      ${USOS.map(u=>`<div>${chk(selectedUso===u)}<span style="font-weight:${selectedUso===u?700:400};">${u}</span></div>`).join("")}
    </div>
  </div>
  <div style="border-top:1px solid #ccc;padding-top:16px;display:flex;justify-content:flex-end;">
    <div style="text-align:center;">
      <div style="width:180px;border-bottom:1px solid #555;margin-bottom:5px;"></div>
      <div style="font-size:10px;color:#888;">Firma / Sello</div>
    </div>
  </div>
  <script>window.onload=function(){window.print();};<\/script>
</body></html>`;

  // Abrir en nueva pestaña y disparar impresión → guardar como PDF
  const win = window.open("", "_blank");
  win.document.write(html);
  win.document.close();
}

/* ══ NUEVA RECETA ════════════════════════════════════════════ */
function newReceta() {
  document.getElementById("nombre").value = "";
  document.getElementById("fecha").value  = new Date().toLocaleDateString("es-ES");
  FIELDS.forEach(f=>{
    const od=document.getElementById(`od-${f.id}`); if(od)od.value="";
    const oi=document.getElementById(`oi-${f.id}`); if(oi)oi.value="";
  });
  document.getElementById("add-od").value = "";
  document.getElementById("add-oi").value = "";
  document.getElementById("raw-input").value = "";
  document.getElementById("parse-msg").textContent = "";
  selectedSpec=""; selectedUso="";
  refreshChips("chips-specs", SPECS, ()=>selectedSpec);
  refreshChips("chips-uso",   USOS,  ()=>selectedUso);
  document.getElementById("errors").style.display="none";
  setMode("manual");
}

/* ══ INIT ════════════════════════════════════════════════════ */
document.addEventListener("DOMContentLoaded", () => {
  renderDots(false);
  renderKeypad();
  buildEyeRow("row-od","od","O.D.");
  buildEyeRow("row-oi","oi","O.I.");
  buildChips("chips-specs", SPECS, ()=>selectedSpec, v=>{ selectedSpec=v; });
  buildChips("chips-uso",   USOS,  ()=>selectedUso,  v=>{ selectedUso=v;  });
  document.getElementById("fecha").value = new Date().toLocaleDateString("es-ES");
});
</script>
